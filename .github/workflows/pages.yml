# Publica a pasta dist/ no GitHub Pages a cada envio para a main.
# Configuração única no GitHub: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir a regra da norma (64 casos)
        run: node verify.cjs
      - name: Carimbar a versão (o site se atualiza sozinho no celular)
        run: |
          V="${GITHUB_SHA::7}"
          echo "{\"v\":\"$V\"}" > dist/versao.json
          for f in dist/index.html dist/avaliar/index.html dist/dashboard/index.html dist/acoes/index.html; do
            sed -i -E "s/__VERSAO__/$V/g; s/\?v=[0-9a-z]+\"/?v=$V\"/g" "$f"
          done
          grep -o 'versao" content="[^"]*' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
